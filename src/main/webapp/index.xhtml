<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <h:outputStylesheet name="css/mycsslayout.css"/>
    <h:outputScript name="js/script.js" target="head"/>
    <title>Conversation avec Gemini</title>
</h:head>

<h:body>
    <h:messages id="messages"
                errorStyle="color: red"
                showDetail="true"
                showSummary="false"
                globalOnly="true"/>

    <h:form id="form">

        <p:outputLabel for="rolesysteme" value="Rôle de l'API : "/>

        <p:selectOneMenu id="rolesysteme"
                         value="#{bb.roleSysteme}"
                         editable="true"
                         required="true"
                         requiredMessage="Vous devez indiquer le rôle de l'API"
                         disabled="#{!bb.roleSystemeChangeable}">
            <f:selectItems value="#{bb.rolesSysteme}"/>
        </p:selectOneMenu>

        <h:message for="rolesysteme" errorStyle="color: red"/>

        <h:commandButton value="Nouveau chat"
                         action="#{bb.nouveauChat}"
                         immediate="true"/>

        <h:panelGrid id="paneltotal"
                     columns="2"
                     columnClasses="topAligned,topAligned">

            <h:panelGrid id="panelgauche" columns="1">

                <h:panelGrid id="questionetreponse" columns="1">

                    <h:panelGroup>
                        <h:outputText value="Question :"/>
                        <button type="button"
                                onclick="copyToClipboard('question')">
                            Copier question
                        </button>
                        <button type="button" onclick="toutEffacer()">
                            Effacer question et réponse
                        </button>
                    </h:panelGroup>

                    <h:inputTextarea id="question"
                                     value="#{bb.question}"
                                     title="Question"
                                     cols="50"
                                     rows="5"/>

                    <h:commandButton value="Envoyer la question"
                                     action="#{bb.envoyer}"/>

                    <h:panelGroup>
                        <h:outputText value="Réponse :"/>
                        <button type="button"
                                onclick="copyToClipboard('reponse')">
                            Copier réponse
                        </button>
                    </h:panelGroup>

                    <h:inputTextarea id="reponse"
                                     value="#{bb.reponse}"
                                     title="Réponse"
                                     cols="50"
                                     rows="15"
                                     readonly="true"/>

                    <p:outputPanel
                            style="display:flex; align-items:center; gap:10px">
                        <h:outputText value="Mode debug : "/>

                        <p:toggleSwitch id="debugSwitch"
                                        value="#{bb.debug}">
                            <p:ajax process="@this" update="debugContainer"/>
                        </p:toggleSwitch>

                        <p:tooltip for="debugSwitch"
                                   value="Afficher les JSON des requêtes et réponses."/>
                    </p:outputPanel>

                </h:panelGrid>

                <!-- Le conteneur reste présent pour la mise à jour AJAX. -->
                <h:panelGroup id="debugContainer" layout="block">

                    <h:panelGrid columns="1" rendered="#{bb.debug}">

                        <h:outputText value="JSON de la requête :"/>

                        <h:inputTextarea id="texteRequeteJson"
                                         value="#{bb.texteRequeteJson}"
                                         title="JSON de la requête"
                                         cols="65"
                                         rows="15"
                                         readonly="true"/>

                        <h:outputText value="JSON de la réponse :"/>

                        <h:inputTextarea id="texteReponseJson"
                                         value="#{bb.texteReponseJson}"
                                         title="JSON de la réponse"
                                         cols="65"
                                         rows="15"
                                         readonly="true"/>

                    </h:panelGrid>

                </h:panelGroup>

            </h:panelGrid>

            <h:panelGrid id="paneldroit"
                         columns="1"
                         style="vertical-align:top">

                <h:panelGroup>
                    <h:outputText value="Conversation :"/>
                    <button type="button"
                            onclick="copyToClipboard('conversation')">
                        Copier conversation
                    </button>
                </h:panelGroup>

                <h:inputTextarea id="conversation"
                                 value="#{bb.conversation}"
                                 title="Conversation entière"
                                 rows="30"
                                 cols="50"
                                 readonly="true"/>

            </h:panelGrid>

        </h:panelGrid>

    </h:form>
</h:body>
</html>
